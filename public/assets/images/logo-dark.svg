<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5BE" />
      <stop offset="50%" stop-color="#00A3A6" />
      <stop offset="100%" stop-color="#053354" />
    </linearGradient>
    <linearGradient id="shieldTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#00E5BE" />
      <stop offset="100%" stop-color="#00A3A6" />
    </linearGradient>
    <linearGradient id="shieldNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Shield Monogram "G" -->
  <g transform="translate(10, 5)">
    <!-- Top Teal Prism Facet -->
    <path d="M 50 5 L 85 24 L 50 42 L 15 24 Z" fill="url(#shieldTopGrad)" />
    
    <!-- Left Ribbon Facet (Outer Shell) -->
    <path d="M 15 24 L 50 42 L 50 88 L 15 68 Z" fill="url(#shieldTealGrad)" filter="url(#shieldGlow)" opacity="0.95" />
    
    <!-- Right Outer Shell Facet -->
    <path d="M 85 24 L 85 68 L 50 88 L 50 42 Z" fill="#0A2A4A" />
    
    <!-- Inner Monogram "G" Cutout Shield Core -->
    <path d="M 43 38 L 72 52 L 72 65 L 50 77 L 28 65 L 28 47 L 38 42 L 38 58 L 50 65 L 62 58 L 62 55 L 43 45 Z" fill="#FFFFFF" />
    
    <!-- Stylized Teal Focus Dot / Gateway Node -->
    <circle cx="50" cy="53" r="3.5" fill="#00E5BE" filter="url(#shieldGlow)" />
  </g>

  <!-- GuardAgent Brandmark Typography -->
  <g transform="translate(110, 56)">
    <!-- "Guard" in Pure High-Contrast White -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="40" fill="#FFFFFF" letter-spacing="-1.2">Guard</text>
    
    <!-- "Agent" in Vibrant Surgical Teal -->
    <text x="122" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="40" fill="#00C4B4" letter-spacing="-1.2">Agent</text>
    
    <!-- Subtitle: "AI AGENT SECURITY PLATFORM" -->
    <text x="3" y="24" font-family="'JetBrains Mono', 'Inter', monospace" font-weight="600" font-size="11" fill="#8EA0B8" letter-spacing="3.8">AI AGENT SECURITY PLATFORM</text>
  </g>
</svg>
