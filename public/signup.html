<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Free Account — GuardAgent Gateway</title>
  <meta name="description" content="Sign up for the GuardAgent AI Agent Security Platform SOC console.">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" type="image/png" href="/assets/images/logo-transparent.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    .btn-loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>
<body class="neo-brutalist-theme">
  <div class="nb-auth-wrapper">
    <div class="nb-auth-bg-pattern"></div>

    <!-- Top Navigation Bar -->
    <div style="width: 100%; max-width: 520px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1;">
      <a href="/" class="nb-btn nb-btn-sm nb-btn-white" style="font-size: 0.75rem; padding: 6px 12px;">
        &larr; BACK TO HOME
      </a>
      <span class="nb-sticker nb-sticker-yellow tilt-1" style="font-size: 0.65rem;">100% FREE &bull; APACHE 2.0</span>
    </div>

    <!-- Main Neo-Brutalist Signup Card -->
    <div class="nb-auth-card wide">
      <div class="nb-auth-header">
        <a href="/" style="display: inline-block; margin-bottom: 8px;" aria-label="GuardAgent Home">
          <img src="/assets/images/logo-transparent.png" alt="GuardAgent Logo" class="nb-logo-img" style="height: 44px; width: auto;">
        </a>
        <div>
          <span class="nb-sticker nb-sticker-mint tilt-2" style="font-size: 0.65rem; margin-top: 4px;">FREE OPERATOR WORKSPACE</span>
        </div>
        <h1 class="nb-auth-title">Create Your Workspace</h1>
        <p class="nb-auth-subtitle">
          Add a 0.8ms deterministic firewall between your AI agents and real APIs.
        </p>
      </div>

      <!-- Alert / Status Notice Banner -->
      <div id="signupAlert" class="nb-auth-alert"></div>

      <form id="signupForm" class="nb-auth-form">
        <div class="nb-form-group">
          <label class="nb-form-label" for="fullName">Lead Operator Name</label>
          <input type="text" id="fullName" class="nb-form-input" placeholder="Sarah Chen" required autocomplete="name">
        </div>

        <div class="nb-form-group">
          <label class="nb-form-label" for="organization">Organization / Team Identity</label>
          <input type="text" id="organization" class="nb-form-input" placeholder="Acme AI Engineering" required autocomplete="organization">
        </div>

        <div class="nb-form-group">
          <label class="nb-form-label" for="email">Work Email</label>
          <input type="email" id="email" class="nb-form-input" placeholder="s.chen@acme-corp.com" required autocomplete="email">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="nb-form-group">
            <label class="nb-form-label" for="password">Password</label>
            <input type="password" id="password" class="nb-form-input" placeholder="Min. 8 chars" minlength="8" required autocomplete="new-password">
          </div>

          <div class="nb-form-group">
            <label class="nb-form-label" for="confirmPassword">Confirm</label>
            <input type="password" id="confirmPassword" class="nb-form-input" placeholder="Repeat password" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="nb-btn nb-btn-teal" style="width: 100%; padding: 13px; margin-top: 8px; font-size: 0.95rem;">
          🚀 Initialize Workspace &amp; Launch &rarr;
        </button>
      </form>

      <div class="nb-auth-footer">
        <span>Already have an account?</span>
        <a href="/login">Sign In here &rarr;</a>
      </div>
    </div>

    <!-- Bottom Footer Note -->
    <div style="position: relative; z-index: 1; margin-top: 14px; font-size: 0.75rem; font-weight: 700; color: #64748B; font-family: var(--font-mono); text-align: center;">
      Runs locally on your computer or private cloud &bull; Zero external data sharing
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const alertBox = document.getElementById('signupAlert');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'nb-auth-alert ' + (type === 'error' ? 'error' : 'success');
      alertBox.style.display = 'block';
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const organization = document.getElementById('organization').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert("Passwords do not match. Please verify and retry.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('btn-loading');
      submitBtn.textContent = 'Enrolling workspace...';
      alertBox.style.display = 'none';

      try {
        const res = await window.api.signup({
          full_name: fullName,
          organization: organization,
          email: email,
          password: password
        });

        showAlert(res.message || "Account initialized! Loading SOC workspace...", "success");
        setTimeout(() => {
          window.location.href = '/app/';
        }, 600);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Initialize Workspace & Launch →';
        showAlert(err.message || "Enrollment failed. Please check inputs and retry.", "error");
      }
    });
  </script>
</body>
</html>
